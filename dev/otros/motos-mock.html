<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Monoton&display=swap">
<style>

*{box-sizing:border-box}
html,body{margin:0;background:#000}

.bars{display:flex;gap:10px;align-items:center}
.lives{display:flex;gap:3px}
.meter{display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--dim)}
.meter span{display:block;width:74px;height:7px;border:1px solid #fff8;background:#0006;position:relative}

.zone{position:absolute;top:86px;left:10px;font-size:12px;color:var(--cyan);background:#0009;padding:5px 9px;border:1px solid var(--cyan);text-shadow:0 0 6px var(--cyan);white-space:nowrap}

.bubble.r::after{left:auto;right:8px}
.tag{position:absolute;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap}
.glow{position:absolute;width:28px;height:28px;border-radius:50%;filter:blur(3px);mix-blend-mode:screen}

.pad-tag{position:absolute;top:5px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);letter-spacing:2px}

.scene2 #sea{display:none} .scene2 #bar{display:block}

.btn.p{border-color:var(--pink);background:linear-gradient(#ff2fa8,#a0106a);box-shadow:0 4px 0 #5a0a3c}
</style></head>
