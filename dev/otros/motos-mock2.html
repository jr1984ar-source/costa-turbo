<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Saira:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0a1630;--glass:rgba(8,22,48,.55);--line:rgba(255,255,255,.16);--ink:#ffffff;--dim:rgba(255,255,255,.66);--gold:#ffc93c;--orange:#ff7a1a;--cyan:#33d6ff;--lime:#7be35a;--red:#ff4757}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
body{font-family:Saira,system-ui,sans-serif;color:var(--ink)}
.cond{font-family:'Saira Condensed',Saira,sans-serif}
#app{width:390px;height:844px;display:grid;grid-template-rows:664px 180px;background:var(--navy);overflow:hidden;position:relative}
#stage{position:relative;overflow:hidden}
canvas{display:block}
#cv{position:absolute;left:0;top:0;width:390px;height:664px}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,10,30,.25)}
.hud{position:absolute;left:10px;right:10px;top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hb{padding:6px 10px 5px}
.hb small{display:block;font-family:'Saira Condensed';font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--dim);line-height:1}
.hb b{font-family:'Saira Condensed';font-weight:800;font-size:28px;line-height:1.05;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hb b i{font-style:normal;font-size:16px;color:var(--dim);font-weight:700}
.hb.c{text-align:center}.hb.r{text-align:right}
.money b{color:var(--gold);display:inline-flex;align-items:center;gap:5px}
.money b em{font-style:normal;font-size:14px;color:var(--gold);opacity:.85}
.zone{position:absolute;left:10px;top:72px;padding:5px 11px;border-radius:999px;font-family:'Saira Condensed';font-weight:700;font-size:13px;letter-spacing:.08em;display:flex;gap:6px;align-items:center}
.zone span{color:var(--cyan)}
.gauge{position:absolute;left:8px;bottom:8px;width:106px;height:106px;display:grid;place-items:center}
.gauge svg{position:absolute;inset:0}
.gauge .v{font-family:'Saira Condensed';font-weight:800;font-size:34px;line-height:.9;text-align:center;margin-top:6px}
.gauge .v small{display:block;font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:600}
.fuel{position:absolute;left:120px;bottom:14px;width:110px;padding:6px 9px}
.fuel small{display:flex;justify-content:space-between;font-family:'Saira Condensed';font-weight:600;font-size:10px;letter-spacing:.1em;color:var(--dim)}
.fuel .fb{display:block;height:6px;border-radius:4px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}
.fuel .fb i{display:block;height:100%;width:62%;border-radius:4px;background:linear-gradient(90deg,#ff4757,#ffc93c 55%,#7be35a)}
.track{position:absolute;right:6px;top:118px;height:400px;width:16px;display:flex;justify-content:center}
.track::before{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.track .dot{position:absolute;left:3px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.track .dot.me{width:14px;height:14px;left:1px;border-width:3px}
.track .flag{position:absolute;top:-12px;left:0;width:16px;height:10px;background:conic-gradient(#fff 0 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/8px 5px;border:1px solid #fff}
.pill{position:absolute;padding:4px 9px;border-radius:10px;font-family:'Saira Condensed';font-weight:700;font-size:12px;line-height:1.1;letter-spacing:.04em;white-space:nowrap}
.pill small{display:block;font-weight:600;font-size:10px;color:var(--gold);letter-spacing:.06em}
.bubble{position:absolute;background:#fff;color:#0d1b33;font-family:'Saira Condensed';font-weight:700;font-size:13px;line-height:1.1;padding:6px 10px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;bottom:-7px;right:16px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.l::after{right:auto;left:18px}
/* pads */
.pads{display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(#13254a,#0a1630);border-top:1px solid rgba(255,255,255,.12);position:relative}
.pad{display:flex;align-items:center;gap:10px;padding:16px 14px 20px;position:relative}
.pad-tag{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:'Saira Condensed';font-weight:600;font-size:11px;color:var(--dim);letter-spacing:.2em}
.arrow{flex:1;height:100px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.3)}
.arrow svg{width:30px;height:30px;fill:#fff}
.right{justify-content:flex-end}
.ab{border-radius:50%;display:grid;place-items:center;text-align:center;position:relative;flex:none;font-family:'Saira Condensed';font-weight:800;letter-spacing:.06em}
.acc{width:104px;height:104px;font-size:15px;color:#fff;background:radial-gradient(circle at 50% 30%,#ffb067,#ff7a1a 55%,#d4520a);box-shadow:0 10px 22px rgba(255,122,26,.45),inset 0 -6px 12px rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.acc svg{width:22px;height:22px;fill:#fff;display:block;margin:0 auto 2px}
.tur{width:78px;height:78px;align-self:flex-start;font-size:13px;color:#fff;background:radial-gradient(circle at 50% 30%,#7fe8ff,#18b6e6 60%,#0a7fb0);box-shadow:0 8px 18px rgba(51,214,255,.4),inset 0 2px 0 rgba(255,255,255,.35)}
.tur::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#fff 0 40%,rgba(255,255,255,.18) 0);-webkit-mask:radial-gradient(circle,transparent 60%,#000 61%);mask:radial-gradient(circle,transparent 60%,#000 61%)}
.badge{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0a7fb0;font-size:13px;font-weight:800}
/* roxy */
#roxy{display:none}.s2 #sea{display:none}.s2 #roxy{display:block}
#rcv{width:390px;height:272px}
.shop{position:absolute;left:0;right:0;top:272px;bottom:0;padding:10px 12px 12px;background:linear-gradient(#0d2a4a,#0a1630);display:flex;flex-direction:column;gap:8px}
.shop-h{display:flex;justify-content:space-between;align-items:center}
.shop-h h3{margin:0;font-family:'Saira Condensed';font-weight:800;font-size:20px;letter-spacing:.04em;line-height:1}
.shop-h h3 small{display:block;font-size:11px;font-weight:600;color:var(--cyan);letter-spacing:.16em}
.cash{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,201,60,.14);border:1px solid rgba(255,201,60,.4);font-family:'Saira Condensed';font-weight:800;font-size:18px;color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{position:relative;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:7px 8px;display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center}
.card canvas{width:40px;height:40px;border-radius:10px;background:radial-gradient(circle at 40% 30%,#24406e,#0c1c3a)}
.card .nm{font-family:'Saira Condensed';font-weight:700;font-size:15px;line-height:1}
.card .ef{font-size:10.5px;line-height:1.15;color:var(--dim);margin-top:3px}
.card .bar{display:flex;gap:3px;margin-top:5px}.card .bar i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}.card .bar i.on{background:var(--cyan)}
.card .pr{font-family:'Saira Condensed';font-weight:800;font-size:15px;color:var(--gold);margin-top:4px}
.card .ok{display:inline-block;margin-top:5px;font-family:'Saira Condensed';font-weight:700;font-size:11px;letter-spacing:.08em;color:#0b2a12;background:var(--lime);padding:1px 7px;border-radius:999px}
.card.sel{border:2px solid var(--orange);background:rgba(255,122,26,.13);box-shadow:0 0 0 4px rgba(255,122,26,.15)}
.btns{display:flex;gap:8px;margin-top:auto}
.btn{flex:1;text-align:center;font-family:'Saira Condensed';font-weight:800;font-size:16px;letter-spacing:.06em;padding:10px 6px;border-radius:14px;border:1px solid rgba(255,255,255,.3);color:#fff}
.btn.p{border:0;background:linear-gradient(#ff9a3d,#ff6a00);box-shadow:0 8px 18px rgba(255,122,26,.35)}
</style></head>
<body>
<div id="app">
  <div id="stage">
    <div id="sea">
      <canvas id="cv" width="780" height="1328"></canvas>
      <div class="pill panel" style="left:196px;top:212px">BAR JJ'S<small>VIDAS · GASOLINA</small></div>
      <div class="bubble" style="left:218px;top:104px">¡Holaaa, guapo!</div>
      <div class="hud">
        <div class="hb panel"><small>POSICIÓN</small><b>3º<i>/6</i></b></div>
        <div class="hb panel c"><small>TIEMPO</small><b>0:42</b></div>
        <div class="hb panel r money"><small>PESETAS</small><b><canvas id="coinHud" width="44" height="44" style="width:20px;height:20px"></canvas>1.250</b></div>
      </div>
      <div class="zone panel">ZONA 1 <span>·</span> EL PUERTO</div>
      <div class="track"><div class="flag"></div><div class="dot" style="top:40px;background:#1e5eff"></div><div class="dot" style="top:92px;background:#5fd31a"></div><div class="dot me" style="top:150px;background:#e3202b"></div><div class="dot" style="top:162px;background:#ffd21a"></div><div class="dot" style="top:210px;background:#ff3b3b"></div><div class="dot" style="top:236px;background:#1f2127"></div></div>
      <div class="gauge panel" style="border-radius:50%">
        <svg viewBox="0 0 106 106"><circle cx="53" cy="53" r="42" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="7" stroke-linecap="round" stroke-dasharray="198 66" transform="rotate(135 53 53)"/><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#33d6ff"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient></defs><circle cx="53" cy="53" r="42" fill="none" stroke="url(#sg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="128 136" transform="rotate(135 53 53)"/></svg>
        <div class="v">87<small>KM/H</small></div>
      </div>
      <div class="fuel panel"><small><b style="font-weight:600">GASOLINA</b><b style="font-weight:600">62%</b></small><div class="fb"><i></i></div></div>
    </div>
    <div id="roxy">
      <canvas id="rcv" width="780" height="544"></canvas>
      <div class="bubble l" style="left:196px;top:62px">¿Qué le ponemos<br>a tu moto, piloto?</div>
      <div class="pill panel" style="left:58px;top:182px">TU MOTO</div>
      <div class="shop">
        <div class="shop-h"><h3><small>BAR ROXY · LA CALA</small>TIENDA DE PIEZAS</h3><div class="cash"><canvas id="coinShop" width="44" height="44" style="width:20px;height:20px"></canvas>4.750 PTA</div></div>
        <div class="grid" id="grid"></div>
        <div class="btns"><div class="btn p">COMPRAR · 3.000</div><div class="btn">VOLVER AL MAR</div></div>
      </div>
    </div>
  </div>
  <div class="pads">
    <div class="pad"><span class="pad-tag">GIRAR</span>
      <div class="arrow"><svg viewBox="0 0 20 20"><path d="M13.5 3 6 10l7.5 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="arrow"><svg viewBox="0 0 20 20"><path d="M6.5 3 14 10l-7.5 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
    <div class="pad right">
      <div class="ab tur">TURBO<span class="badge">2</span></div>
      <div class="ab acc"><div><svg viewBox="0 0 20 20"><path d="M10 2 18 12h-5v6H7v-6H2z"/></svg>ACELERAR</div></div>
    </div>
  </div>
</div>
<script>
const S2=location.search.includes('roxy');if(S2)document.body.classList.add('s2');
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const TAU=Math.PI*2,sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
function coinIcon(id){const cv=document.getElementById(id),g=cv.getContext('2d');g.scale(2,2);const gr=g.createRadialGradient(8,8,1,11,11,11);gr.addColorStop(0,'#fff3b0');gr.addColorStop(.5,'#f7c531');gr.addColorStop(1,'#b8860b');g.fillStyle=gr;g.beginPath();g.arc(11,11,10,0,TAU);g.fill();g.strokeStyle='rgba(120,80,0,.6)';g.beginPath();g.arc(11,11,7,0,TAU);g.stroke();g.fillStyle='#0a1630';g.beginPath();g.arc(11,11,2.6,0,TAU);g.fill();}
const SK={
 rojablanca:{hull:'#f5f6f8',hullD:'#c3c9d2',acc:'#e3202b',seat:'#1d1f24',vest:'#e3202b',helmet:'#ffffff',hstripe:'#e3202b',arm:'#e3202b'},
 roja:{hull:'#e3202b',hullD:'#8f0f17',acc:'#ffffff',seat:'#1d1f24',vest:'#16181d',helmet:'#e3202b',hstripe:'#ffffff',arm:'#16181d'},
 negra:{hull:'#25272e',hullD:'#0b0c0f',acc:'#ffd21a',seat:'#121317',vest:'#ffd21a',helmet:'#25272e',hstripe:'#ffd21a',arm:'#ffd21a'},
 azul:{hull:'#1e5eff',hullD:'#0b2c8f',acc:'#ffffff',seat:'#15171c',vest:'#ffffff',helmet:'#1e5eff',hstripe:'#ffffff',arm:'#1e5eff'},
 amarilla:{hull:'#ffd21a',hullD:'#c08f00',acc:'#2a2c33',seat:'#2a2c33',vest:'#2a2c33',helmet:'#ffd21a',hstripe:'#2a2c33',arm:'#2a2c33'},
 verde:{hull:'#5fd31a',hullD:'#2b7d00',acc:'#111317',seat:'#111317',vest:'#111317',helmet:'#5fd31a',hstripe:'#111317',arm:'#111317'}
};

Promise.all(['800 12px "Saira Condensed"','700 12px "Saira Condensed"'].map(f=>document.fonts.load(f))).catch(()=>{}).then(()=>{
if(!S2){
const cv=document.getElementById('cv'),c=cv.getContext('2d');c.scale(2,2);const W=390,H=664;
function shore(y){let x=76+26*sm(98,112,y)*(1-sm(258,272,y));if(y>330&&y<520)x-=20*Math.sin((y-330)/190*Math.PI);if(y>=512)x+=36*Math.sin(Math.min(1,(y-512)/150)*Math.PI*.92)+Math.sin(y*.31)*3+Math.sin(y*.83+1)*2.2;return x;}
// ---- water
let g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#7ee6d8');g.addColorStop(.26,'#35c0d6');g.addColorStop(.52,'#178fcc');g.addColorStop(1,'#0b5cad');c.fillStyle=g;c.fillRect(0,0,W,H);
g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,25,70,.16)');g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,25,70,.1)');c.fillStyle=g;c.fillRect(0,0,W,H);
let r=rng(11);
for(let i=0;i<70;i++){const y=r()*H,x=shore(y)+6+r()*70,rr=6+r()*22;const gg=c.createRadialGradient(x,y,0,x,y,rr);gg.addColorStop(0,`rgba(10,70,80,${.18+r()*.14})`);gg.addColorStop(1,'rgba(10,70,80,0)');c.fillStyle=gg;c.beginPath();c.arc(x,y,rr,0,TAU);c.fill();}
for(let i=0;i<420;i++){const x=r()*W,y=r()*H,len=10+r()*26,ph=r()*6,near=Math.max(0,1-(x-shore(y))/170);c.strokeStyle=`rgba(255,255,255,${.05+near*.12+r()*.04})`;c.lineWidth=.8+r()*.6;c.beginPath();for(let t=0;t<=1;t+=.1){const xx=x+t*len,yy=y+Math.sin(t*5+ph)*2.2;t?c.lineTo(xx,yy):c.moveTo(xx,yy);}c.stroke();}
for(let i=0;i<120;i++){const x=150+r()*240,y=r()*H,rr=4+r()*9;c.strokeStyle=`rgba(255,255,255,${.12+r()*.14})`;c.lineWidth=1.1;c.beginPath();c.arc(x,y,rr,Math.PI*1.15,Math.PI*1.85);c.stroke();}
for(let i=0;i<34;i++){const x=120+r()*270,y=r()*H,s=1.5+r()*2.5;c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.moveTo(x,y-s);c.lineTo(x+s*.25,y-s*.25);c.lineTo(x+s,y);c.lineTo(x+s*.25,y+s*.25);c.lineTo(x,y+s);c.lineTo(x-s*.25,y+s*.25);c.lineTo(x-s,y);c.lineTo(x-s*.25,y-s*.25);c.fill();}
// ---- land
const landPath=()=>{c.beginPath();c.moveTo(0,0);for(let y=0;y<=H;y+=2)c.lineTo(shore(y),y);c.lineTo(0,H);c.closePath();};
c.save();c.shadowColor='rgba(0,40,60,.35)';c.shadowBlur=10;c.shadowOffsetX=3;landPath();c.fillStyle='#ece5d8';c.fill();c.restore();
c.save();landPath();c.clip();
// promenade tiles
c.fillStyle='#ebe4d6';c.fillRect(0,0,W,332);c.strokeStyle='rgba(150,130,100,.13)';c.lineWidth=.7;for(let y=0;y<332;y+=11){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}for(let x=0;x<130;x+=11){c.beginPath();c.moveTo(x,0);c.lineTo(x,332);c.stroke();}
// beach
g=c.createLinearGradient(0,0,90,0);g.addColorStop(0,'#f5dfb2');g.addColorStop(1,'#e9c98d');c.fillStyle=g;c.fillRect(0,332,W,190);r=rng(4);for(let i=0;i<900;i++){c.fillStyle=r()>.5?'rgba(180,140,80,.25)':'rgba(255,255,255,.35)';c.fillRect(r()*100,332+r()*190,1,1);}
c.fillStyle='#d4d0c6';c.fillRect(0,328,W,5);
// cliffs
c.fillStyle='#c47a44';c.fillRect(0,516,W,150);r=rng(9);const rc=['#d98f57','#b9693a','#e7a46b','#a75d31','#cf8650'];
for(let i=0;i<190;i++){const x=r()*130,y=518+r()*150,s=5+r()*13,n=5;c.fillStyle=rc[(r()*5)|0];c.globalAlpha=.85;c.beginPath();for(let k=0;k<n;k++){const a=k/n*TAU+r()*.5,d=s*(.6+r()*.5);k?c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d*.7):c.moveTo(x+Math.cos(a)*d,y+Math.sin(a)*d*.7);}c.fill();}
c.globalAlpha=1;c.strokeStyle='rgba(90,40,15,.35)';c.lineWidth=1;for(let i=0;i<40;i++){const x=r()*120,y=520+r()*140;c.beginPath();c.moveTo(x,y);c.lineTo(x+(r()-.5)*14,y+r()*10);c.stroke();}
c.restore();
// seawall edge + boardwalk on promenade
c.save();c.beginPath();for(let y=0;y<=332;y+=2)c.lineTo(shore(y),y);for(let y=332;y>=0;y-=2)c.lineTo(shore(y)-15,y);c.closePath();c.fillStyle='#f6f2ea';c.fill();c.clip();c.strokeStyle='rgba(160,140,110,.35)';c.lineWidth=.6;for(let y=0;y<332;y+=3.2){c.beginPath();c.moveTo(0,y);c.lineTo(140,y);c.stroke();}c.restore();
c.strokeStyle='#cbbfa9';c.lineWidth=2.5;c.beginPath();for(let y=0;y<=332;y+=2)c.lineTo(shore(y)+1,y);c.stroke();
// shore foam on beach & cliffs
r=rng(21);for(let y=332;y<H;y+=1.5){const x=shore(y);c.fillStyle=`rgba(255,255,255,${.4+r()*.5})`;c.beginPath();c.arc(x+1+r()*3,y,1+r()*1.6,0,TAU);c.fill();if(r()>.6){c.fillStyle='rgba(255,255,255,.25)';c.beginPath();c.arc(x+5+r()*5,y,1+r()*1.5,0,TAU);c.fill();}}
// palms
function leaf(x,y,a,L,col){c.save();c.translate(x,y);c.rotate(a);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(L*.5,-L*.24,L,0);c.quadraticCurveTo(L*.5,L*.16,0,0);c.fillStyle=col;c.fill();c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=.7;c.beginPath();c.moveTo(1,0);c.quadraticCurveTo(L*.5,-L*.05,L*.95,0);c.stroke();c.restore();}
function palm(x,y,R,seed){const q=rng(seed);c.save();c.globalAlpha=.22;for(let k=0;k<8;k++)leaf(x+7,y+6,k/8*TAU+.2,R,'#203018');c.restore();for(let k=0;k<8;k++){const a=k/8*TAU+q()*.35;leaf(x,y,a,R*(.85+q()*.3),k%2?'#2f8f3f':'#46aa4a');}c.fillStyle='#7a5228';c.beginPath();c.arc(x,y,2.6,0,TAU);c.fill();}
