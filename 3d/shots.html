<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;font-family:"Saira Condensed","Arial Narrow",Arial,sans-serif;color:#fff;display:none}
.sp{position:absolute;left:22px;top:14px;font-weight:800;font-size:44px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.45)}.sp small{font-size:16px;opacity:.85;margin-left:4px}
.pad{position:absolute;bottom:14px}.l{left:18px}.r{right:18px;display:flex;gap:10px;align-items:flex-end}
.arrows{display:flex;gap:10px}.ar{width:64px;height:64px;border-radius:50%;background:rgba(11,22,48,.42);border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;font-size:26px;font-weight:800}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.85;margin-bottom:4px}
.pill{border-radius:999px;padding:9px 14px;font-weight:800;font-size:15px;background:rgba(11,22,48,.42);border:2px solid rgba(255,255,255,.55)}
.tur{background:rgba(255,122,26,.85);border-color:#ffe14d}
.acc{width:92px;height:92px;border-radius:50%;background:rgba(255,122,26,.9);border:3px solid #ffe14d;display:grid;place-items:center;font-weight:800;font-size:15px}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.mini{position:absolute;right:16px;top:12px;width:92px;height:92px;border-radius:14px;background:rgba(11,22,48,.35);border:2px solid rgba(255,255,255,.4)}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="hud"><div class="sp">68<small>km/h</small></div>
<div class="pad l"><div class="tag">GIRAR</div><div class="arrows"><div class="ar">‹</div><div class="ar">›</div></div></div>
<div class="pad r"><div class="col"><div class="pill tur">TURBO</div><div class="pill">DERRAPE</div></div><div class="acc">ACELERAR</div></div></div>
<script>window.addEventListener('error', e => { window.__err = String(e.message); window.__done = true; });</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { addUnderwater, WORLD, coastZ, heightAt, makeEnv, makeHeightTexture, makeWaveTexture, makeTerrain, makeWater, makeSkyDome, makeEnvMap } from './src/world.js';
import { makeJetSki } from './src/jetski.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { makeGrass, makePalms, makeGull, makeYacht, makeBuoy, makeUmbrella } from './src/props.js';
import { makeWake, makeSpray, sprayForPose } from './src/fx.js';

const Q = new URLSearchParams(location.search), SHOT = Q.get('shot') || 'A', PAINT = Q.get('paint') || 'kawasaki';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(Q.get('exp') || 1.0);
document.body.appendChild(renderer.domElement);

const env = makeEnv({ time: 12.0, sunDir: [0.55, 0.95, -0.30] });
// --- recursos reales (Poly Haven, CC0)
const TL = new THREE.TextureLoader();
const tex = async (f, srgb) => { const t = await TL.loadAsync('assets/tex/' + f); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
const T = { dry: await tex('aerial_beach_01_Diffuse_2k.jpg', 1), dryN: await tex('aerial_beach_01_nor_gl_2k.jpg'), wet: await tex('damp_beach_sand_02_Diffuse_2k.jpg', 1), wetN: await tex('damp_beach_sand_02_nor_gl_2k.jpg'), trk: await tex('aerial_sand_Diffuse_2k.jpg', 1) };
const RL = new RGBELoader();
const skyHdr = await RL.loadAsync('assets/hdri/kloofendal_43d_clear_puresky_2k.hdr'); skyHdr.mapping = THREE.EquirectangularReflectionMapping;
const envHdr = await RL.loadAsync('assets/hdri/spiaggia_di_mondello_2k.hdr'); envHdr.mapping = THREE.EquirectangularReflectionMapping;
const H2F = THREE.DataUtils.fromHalfFloat;
function px(t, i) { const d = t.image.data; return d instanceof Uint16Array ? [H2F(d[i * 4]), H2F(d[i * 4 + 1]), H2F(d[i * 4 + 2])] : [d[i * 4], d[i * 4 + 1], d[i * 4 + 2]]; }
function sunOf(t) { const { width: w, height: h } = t.image; let best = -1, bi = 0; for (let i = 0; i < w * h / 2; i++) { const c = px(t, i), l = c[0] + c[1] + c[2]; if (l > best) { best = l; bi = i; } }
  const u = ((bi % w) + 0.5) / w, v = 1 - (Math.floor(bi / w) + 0.5) / h, ph = (u - 0.5) * 2 * Math.PI, el = (v - 0.5) * Math.PI;
  return new THREE.Vector3(Math.cos(ph) * Math.cos(el), Math.sin(el), Math.sin(ph) * Math.cos(el)); }
function rotFor(d, tg) { let best = 9, ba = 0; for (let i = 0; i < 720; i++) { const a = i / 720 * 2 * Math.PI, v = d.clone().applyEuler(new THREE.Euler(0, a, 0)); const e = Math.atan2(v.x, v.z) - Math.atan2(tg.x, tg.z), er = Math.abs(Math.atan2(Math.sin(e), Math.cos(e))); if (er < best) { best = er; ba = a; } } return ba; }
function horizonOf(t) { const { width: w, height: h } = t.image, y = Math.floor(h * 0.47); const c = [0, 0, 0]; for (let x = 0; x < w; x += 4) { const q = px(t, y * w + x); c[0] += q[0]; c[1] += q[1]; c[2] += q[2]; } const n = w / 4; return new THREE.Color(c[0] / n, c[1] / n, c[2] / n); }
const aSky = rotFor(sunOf(skyHdr), env.sunDir), aEnv = rotFor(sunOf(envHdr), env.sunDir);
env.skyTex = skyHdr; env.skyRot = new THREE.Matrix3().setFromMatrix4(new THREE.Matrix4().makeRotationY(-aSky)); env.skyK = 1.0;
env.hor.copy(horizonOf(skyHdr));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(env.hor.clone(), env.fogNear, env.fogFar);
scene.background = skyHdr; scene.backgroundRotation.set(0, aSky, 0);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(envHdr).texture; scene.environmentRotation.set(0, aEnv, 0); scene.environmentIntensity = 0.55;
const hd = makeHeightTexture(512), waves = makeWaveTexture(256);
scene.add(makeTerrain(env, hd, 400, T));
scene.add(makeWater(env, hd, waves));

// sol con sombras que siguen a la acción
const sun = new THREE.DirectionalLight(new THREE.Color(1.0, 0.93, 0.82), 4.2);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera; sc.left = sc.bottom = -45; sc.right = sc.top = 45; sc.near = 1; sc.far = 400;
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// --- pose de la moto: va hacia el oeste pegada a la orilla, saliendo de una curva
const x0 = 0, z0 = coastZ(0) - 19, th0 = -Math.PI / 2 + 0.25;
const fwdOf = (th) => new THREE.Vector3(Math.sin(th), 0, Math.cos(th));
const path = []; { let x = x0, z = z0; for (let s = 0; s < 150; s += 0.5) { const th = th0 + 0.75 * Math.sin(s / 30); const f = fwdOf(th); path.push({ x: x - f.x * 1.4, z: z - f.z * 1.4, age: s / 16 }); x -= f.x * 0.5; z -= f.z * 0.5; } }
const fwd = fwdOf(th0);
const gl = new GLTFLoader();
async function loadSki(k) {
  const REAL = { kawasaki: ['kawasaki_ultra310', -Math.PI / 2, -0.14], seadoo: ['seadoo_gti', 0, -0.14], negra_turquesa: ['jetski_negra_turquesa', 0, -0.14] };   // motos reales (Sketchfab): [archivo, giro para que la proa mire a +z, altura]
  const [file, oriY, offY] = REAL[k] || ['jetski_' + k, 0, 0];
  const g = await gl.loadAsync('models/' + file + '.glb');
  const root = new THREE.Group(), body = new THREE.Group(), rider = new THREE.Group(); root.add(body); const pivot = new THREE.Group(); pivot.rotation.y = oriY; pivot.position.y = offY; pivot.add(g.scene); body.add(pivot);
  g.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; addUnderwater(o.material, env); } });
  return { root, body, rider };
}
const ski = await loadSki(PAINT);
ski.root.position.set(x0, 0, z0); ski.root.rotation.y = th0;
ski.body.position.y = -0.06; ski.body.rotation.set(-0.07, 0, 0.30);   // proa arriba, inclinada hacia dentro de la curva
ski.rider.rotation.z = 0.12;
if (SHOT !== 'D') { scene.add(ski.root);
{ const wk = makeWake(env, path); wk.userData.noAO = true; scene.add(wk); }
const stern = new THREE.Vector3(x0, 0.2, z0).addScaledVector(fwd, -1.6);
scene.add(makeSpray(env, sprayForPose(stern, fwd, 18, 1))); }
const xd = 30, zd = coastZ(30) - 7;
if (SHOT === 'D') { for (const [k, dx, r] of [['kawasaki', -3.6, 0.5], ['seadoo', 0, 0.25], ['negra_turquesa', 3.6, 0.0]]) { const m = await loadSki(k); m.root.position.set(xd + dx, 0, zd); m.root.rotation.y = Math.PI + 0.5 + r; m.body.position.y = -0.24; m.body.rotation.set(0.03, 0, 0); scene.add(m.root); } }

// vegetación y ambiente
scene.add(makeGrass({ x0: -160, x1: 160, z0: 40, z1: 220 }, 8000));
// palmeras reales de la costa: washingtonias en fila (paseo) y palmeras canarias en grupos
const PW = [], PP = [], PC = [];
for (const n of ['washingtonia_a', 'washingtonia_b']) PW.push((await gl.loadAsync(`models/${n}.glb`)).scene);
PP.push((await gl.loadAsync('models/palmera_canaria.glb')).scene);
for (const n of ['palmera_coco', 'palmera_datilera']) PC.push((await gl.loadAsync(`models/${n}.glb`)).scene);
[...PW, ...PP, ...PC].forEach(m => m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material.map) { o.material.alphaTest = 0.5; o.material.side = THREE.DoubleSide; } } }));
for (let i = 0, x = -150; x < 150; i++, x += 8.5 + (i % 3)) { const z = coastZ(x) + 27 + Math.sin(i * 1.3) * 1.5; const t = PW[i % 2].clone(); t.scale.setScalar(0.85 + (i % 4) * 0.08); t.rotation.y = i * 2.1; t.position.set(x, heightAt(x, z) - 0.1, z); scene.add(t); }
for (let i = 0; i < 14; i++) { const x = -75 + i * 11 + Math.sin(i * 3.1) * 3, z = coastZ(x) + 42 + Math.cos(i * 2.3) * 6; const t = PP[0].clone(); t.scale.setScalar(0.85 + (i % 3) * 0.2); t.rotation.y = i * 1.3; t.position.set(x, heightAt(x, z) - 0.1, z); scene.add(t); }
for (let i = 0; i < 5; i++) { const x = -60 + i * 33 + Math.sin(i * 2.1) * 5, z = coastZ(x) + 34 + Math.cos(i * 1.7) * 4; const t = PC[i % 2].clone(); t.scale.setScalar(0.8 + (i % 3) * 0.1); t.rotation.y = i * 1.9; t.position.set(x, heightAt(x, z) - 0.1, z); scene.add(t); }
const rock = (await gl.loadAsync('models/coast_rocks_02_lite.glb')).scene; rock.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
rock.position.set(-100, -0.7, coastZ(-100) - 2); rock.rotation.y = 2.4; scene.add(rock);
for (let i = 0; i < 7; i++) { const x = -40 + i * 7, u = makeUmbrella(i % 2 ? '#ff5a0a' : '#1e63d6'); u.position.set(x, heightAt(x, coastZ(x) + 12), coastZ(x) + 12); u.rotation.y = i; scene.add(u); }
const yacht = makeYacht(); yacht.position.set(-60, -0.45, coastZ(-60) - 70); yacht.rotation.y = 0.9; scene.add(yacht);
const yacht2 = makeYacht(); yacht2.position.set(45, -0.45, coastZ(45) - 105); yacht2.rotation.y = -0.5; scene.add(yacht2);
for (let i = 0; i < 6; i++) { const b = makeBuoy(i % 2 ? '#ffe14d' : '#ff7a1a'); b.position.set(-35 - i * 14, 0.05, coastZ(-35 - i * 14) - 32 - (i % 2) * 10); scene.add(b); }
const gulls = [[6, 9, -6, 0.5], [-3, 12, 4, -0.2], [12, 14, 2, 0.1], [-8, 10, -12, 0.35]];
for (const [dx, y, dz, fl] of gulls) { const gl = makeGull(fl); gl.position.set(x0 + dx, y, z0 + dz); gl.rotation.y = th0 + 0.4 + dx * 0.05; scene.add(gl); }

// --- cámaras
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 4000);
const focus = new THREE.Vector3(x0, 0, z0);
if (SHOT === 'A') {           // dron alto, como el vídeo
  cam.fov = 42; cam.position.set(x0 + 6, 38, z0 + 46); cam.lookAt(x0 - 1, 0, z0 + 16);
} else if (SHOT === 'B') {    // cámara de juego (detrás)
  cam.fov = 58; const back = fwd.clone().multiplyScalar(-8.2);
  cam.position.set(x0 + back.x + 1.3, 4.3, z0 + back.z + 1.1); cam.lookAt(x0 + fwd.x * 14, 0, z0 + fwd.z * 14);
  document.getElementById('hud').style.display = 'block';
} else if (SHOT === 'D') {
  cam.fov = 38; cam.position.set(xd - 3.5, 2.6, zd - 9.5); cam.lookAt(xd + 0.3, 0.6, zd);
} else {                      // de cerca, tres cuartos
  cam.fov = 34; const side = new THREE.Vector3(-fwd.z, 0, fwd.x);
  cam.position.set(x0 + fwd.x * 6.5 + side.x * 4.5, 2.4, z0 + fwd.z * 6.5 + side.z * 4.5); cam.lookAt(x0 - fwd.x * 0.6, 0.85, z0 - fwd.z * 0.6);
}
cam.updateProjectionMatrix();


// sombras centradas en lo que se ve (con ajuste al texel para que no tiemble)
const c = (SHOT === 'B') ? focus.clone().addScaledVector(fwd, 10) : SHOT === 'D' ? new THREE.Vector3(xd, 0, zd) : focus;
sun.position.copy(c).addScaledVector(env.sunDir, 150); sun.target.position.copy(c);

const rt = new THREE.WebGLRenderTarget(W * devicePixelRatio, H * devicePixelRatio, { type: THREE.HalfFloatType, samples: 4 });
const comp = new EffectComposer(renderer, rt);
comp.addPass(new RenderPass(scene, cam));
const gtao = new GTAOPass(scene, cam, W * devicePixelRatio, H * devicePixelRatio); gtao.blendIntensity = 0.85;
gtao.updateGtaoMaterial({ radius: 0.9, distanceExponent: 1.5, thickness: 1.5, scale: 1.0, samples: 16 }); comp.addPass(gtao);
gtao.overrideVisibility = function () { const c = this._visibilityCache; this.scene.traverse(o => { c.set(o, o.visible); if (o.isPoints || o.isLine || o.userData.noAO) o.visible = false; }); };
comp.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.22, 0.35, 2.4));
comp.addPass(new OutputPass());
comp.render();
window.__done = true;
window.addEventListener('error', () => {});
</script></body></html>
